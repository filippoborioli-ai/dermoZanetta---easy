<!-- PAGINA-LIBERA
     Stampo delle pagine aggiunte dal pannello ("Pagine"). genera.mjs ne
     fa una copia per ogni pagina libera (per esempio tariffe.html) e ci
     scrive dentro i testi di contenuti.json. Le copie non vanno
     modificate a mano: si riscrivono a ogni pubblicazione, e quelle che
     portano la scritta qui sopra vengono cancellate quando la pagina
     viene tolta o nascosta dal pannello. Per cambiare l'aspetto di tutte
     le pagine libere si modifica questo file. -->
<!-- Sicurezza: la pagina carica solo file di questo sito. Se un domani
     si aggiunge qualcosa da fuori (mappa incorporata, font di Google,
     statistiche) va aggiunto qui, oltre che nell'informativa privacy. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
<!-- Lo stampo e' online (serve all'anteprima del pannello) ma e' una
     pagina vuota: fuori da Google. Nelle copie vere questo divieto lo
     toglie il generatore. -->
<!--B:robotsPagina-->
<meta name="robots" content="noindex, nofollow">
<!--/B-->
<!--B:testaPagina-->
<!--/B-->
